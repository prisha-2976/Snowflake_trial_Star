version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: dim_employee
    columns:
      - name: employee_id
        data_tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]
  - name: fact_sales
    description: One row per order line.
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_id}
      - name: product_id
        data_tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_id}
      - name: employee_id
        data_tests:
          - not_null
          - relationships: {to: ref('dim_employee'), field: employee_id}
      - name: order_date_key
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
